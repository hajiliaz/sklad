<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklad.az</title>
    <style>
        /* Общие настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .sklad-az-container {
            background-color: #fff;
            max-width: 794px; /* Ширина для формата A4 */
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
            padding: 20px;
        }

        .photo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .photo img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007acc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .details h1 {
            text-align: center;
            font-size: 28px;
            color: #007acc;
            margin-bottom: 10px;
        }

        .details p {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            color: #555;
        }

        .details h2,
        .details h3 {
            font-size: 20px;
            color: #444;
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 2px solid #007acc;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul li {
            font-size: 18px;
            margin-bottom: 8px;
            padding-left: 10px;
            position: relative;
        }

        ul li::before {
            content: "•";
            color: #007acc;
            position: absolute;
            left: 0;
            top: 0;
            font-size: 18px;
        }

        .gallery {
            display: flex;
            gap: 10px;
            margin-top: 20px; 
            justify-content:space-around;       
        }

        .gallery img {
            width: 145px;
            height: 170px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #ddd;
        }

        a {
            color: #007acc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="sklad-az-container">
        <!-- Секция фото -->
        <div class="photo">
            <img src="sk.az.jpg" alt="Logo of Sklad Baku">
        </div>

        <div class="details">
            <h1>Sklad Baku</h1>
            <p>Original brand clothes with high quality</p>

            <h2>Menu</h2>
            <ul>
                <li>Men
                    <div class="gallery">
                        <img src="sklad-men1.jpg" alt="Men's Fashion 1">
                        <img src="sklad-shoes.men1.jpg" alt="Men's Fashion 2">
                    </div>
                </li>
                <li>Women
                    <div class="gallery">
                        <img src="sklad-women1.jpg" alt="Women's Fashion 1">
                        <img src="sklad-shoes.women1.jpg" alt="Women's Fashion 2">
                    </div>
                </li>
                <li>Unisex
                    <div class="gallery">
                        <img src="sklad-unisex1.jpg" alt="Unisex Fashion 1">
                        <img src="sklad-shoes.uni1.jpg" alt="Unisex Fashion 2">
                    </div>
                </li>
            </ul>

            <h3>Contacts</h3>
            <ul>
                <li><strong>Address:</strong> Khagani street 13 D, Malakan garden (near Bronx Barbershop)</li>
                <li><strong>Phone:</strong> +994(055)-528-28-82</li>
                <li><strong>Instagram:</strong> <a href="https://www.instagram.com/sklad.az" target="_blank">instagram</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
